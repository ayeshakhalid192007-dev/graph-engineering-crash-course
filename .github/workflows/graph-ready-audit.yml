name: graph-ready-audit
on: [push, pull_request]
jobs:
  graph-ready-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run graph-ready audit
        run: node scripts/graph-ready-audit.mjs
