name: markdown-lint
on: [push, pull_request]
jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            docs/**/*.md
            README.md
            CONTRIBUTING.md
            SECURITY.md
            AGENTS.md
            CLAUDE.md
            LOOP.md
            STATE.md
            loop-budget.md
            loop-constraints.md
            loop-run-log.md
