name: originality-check
on: [push, pull_request]
jobs:
  originality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run originality check
        run: node scripts/originality-check.mjs
