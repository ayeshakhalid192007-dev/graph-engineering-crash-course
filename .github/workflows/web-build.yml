name: web-build
on: [push, pull_request]
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build web
        run: |
          if [ -f web/package.json ]; then
            npm ci && npm run build
          else
            echo "web/package.json not created yet (ships Day 4) — skipping."
          fi
