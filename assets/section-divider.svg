<svg viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1325;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#0B1325;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#0B1325;stop-opacity:0.6" />
      <stop offset="80%" style="stop-color:#0B1325;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0B1325;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Horizontal line -->
  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#divider)" stroke-width="2" />
  <!-- Center accent dot -->
  <circle cx="600" cy="30" r="6" fill="#4169E1" opacity="0.7" />
</svg>