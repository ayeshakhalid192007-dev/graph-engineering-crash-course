<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="auto">
  <defs>
    <style>
      .block-title { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #0B1325; }
      .block-subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <!-- Block 1: Shared Facts -->
  <g>
    <rect x="30" y="20" width="170" height="160" rx="6" fill="none" stroke="#4169E1" stroke-width="2"/>
    <circle cx="115" cy="55" r="16" fill="#4169E1"/>
    <text x="115" y="140" text-anchor="middle" class="block-title">Shared Facts</text>
    <text x="115" y="157" text-anchor="middle" class="block-subtitle">Single source of truth</text>
  </g>

  <!-- Block 2: Durable History -->
  <g>
    <rect x="220" y="20" width="170" height="160" rx="6" fill="none" stroke="#0B1325" stroke-width="2"/>
    <line x1="245" y1="45" x2="365" y2="45" stroke="#0B1325" stroke-width="2" opacity="0.6"/>
    <line x1="245" y1="65" x2="360" y2="65" stroke="#0B1325" stroke-width="2" opacity="0.4"/>
    <line x1="245" y1="85" x2="365" y2="85" stroke="#0B1325" stroke-width="2" opacity="0.2"/>
    <text x="305" y="140" text-anchor="middle" class="block-title">Durable History</text>
    <text x="305" y="157" text-anchor="middle" class="block-subtitle">Append-only log</text>
  </g>

  <!-- Block 3: Conflict Resolution -->
  <g>
    <rect x="410" y="20" width="170" height="160" rx="6" fill="none" stroke="#4169E1" stroke-width="2"/>
    <circle cx="470" cy="55" r="8" fill="#4169E1"/>
    <circle cx="495" cy="55" r="8" fill="#0B1325"/>
    <line x1="470" y1="55" x2="495" y2="55" stroke="#4169E1" stroke-width="2" opacity="0.5"/>
    <text x="495" y="140" text-anchor="middle" class="block-title">Conflict Resolution</text>
    <text x="495" y="157" text-anchor="middle" class="block-subtitle">Safe merging</text>
  </g>

  <!-- Block 4: Verification -->
  <g>
    <rect x="600" y="20" width="170" height="160" rx="6" fill="none" stroke="#0B1325" stroke-width="2"/>
    <circle cx="685" cy="55" r="14" fill="none" stroke="#0B1325" stroke-width="2"/>
    <path d="M 681 50 L 685 56 L 691 48" fill="none" stroke="#0B1325" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="685" y="140" text-anchor="middle" class="block-title">Independent Verification</text>
    <text x="685" y="157" text-anchor="middle" class="block-subtitle">Each agent verifies</text>
  </g>

  <!-- Block 5: Auditable State -->
  <g>
    <rect x="790" y="20" width="170" height="160" rx="6" fill="none" stroke="#4169E1" stroke-width="2"/>
    <circle cx="840" cy="50" r="5" fill="#4169E1"/>
    <line x1="845" y1="50" x2="870" y2="50" stroke="#4169E1" stroke-width="1.5"/>
    <circle cx="840" cy="65" r="5" fill="#4169E1"/>
    <line x1="845" y1="65" x2="870" y2="65" stroke="#4169E1" stroke-width="1.5"/>
    <circle cx="840" cy="80" r="5" fill="#4169E1"/>
    <line x1="845" y1="80" x2="870" y2="80" stroke="#4169E1" stroke-width="1.5"/>
    <text x="875" y="140" text-anchor="middle" class="block-title">Auditable State</text>
    <text x="875" y="157" text-anchor="middle" class="block-subtitle">Complete path</text>
  </g>

  <!-- Block 6: Human Oversight -->
  <g>
    <rect x="980" y="20" width="190" height="160" rx="6" fill="none" stroke="#0B1325" stroke-width="2"/>
    <circle cx="1065" cy="50" r="10" fill="#0B1325"/>
    <line x1="1065" y1="60" x2="1065" y2="78" stroke="#0B1325" stroke-width="2" stroke-linecap="round"/>
    <line x1="1048" y1="69" x2="1082" y2="69" stroke="#0B1325" stroke-width="2" stroke-linecap="round"/>
    <text x="1065" y="140" text-anchor="middle" class="block-title">Human Oversight</text>
    <text x="1065" y="157" text-anchor="middle" class="block-subtitle">Escalation & review</text>
  </g>
</svg>