<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
      .block-label { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #0B1325; }
      .block-title { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; fill: #0B1325; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#F8FAFC" />

  <!-- Block 1: Shared Facts -->
  <g>
    <rect x="50" y="80" width="160" height="280" rx="8" fill="#E0E7FF" stroke="#4169E1" stroke-width="2" />
    <circle cx="130" cy="120" r="20" fill="#4169E1" />
    <circle cx="110" cy="150" r="16" fill="#4169E1" opacity="0.6" />
    <circle cx="150" cy="155" r="16" fill="#4169E1" opacity="0.6" />
    <text x="130" y="285" text-anchor="middle" class="block-title">Shared Facts</text>
    <text x="130" y="305" text-anchor="middle" font-size="11" fill="#475569">Conflict-free store</text>
  </g>

  <!-- Block 2: Durable History -->
  <g>
    <rect x="240" y="80" width="160" height="280" rx="8" fill="#F5F3FF" stroke="#0B1325" stroke-width="2" />
    <rect x="265" y="110" width="110" height="15" rx="2" fill="#0B1325" opacity="0.7" />
    <rect x="265" y="135" width="100" height="15" rx="2" fill="#0B1325" opacity="0.5" />
    <rect x="265" y="160" width="110" height="15" rx="2" fill="#0B1325" opacity="0.3" />
    <text x="320" y="285" text-anchor="middle" class="block-title">Durable History</text>
    <text x="320" y="305" text-anchor="middle" font-size="11" fill="#475569">Append-only log</text>
  </g>

  <!-- Block 3: Conflict Resolution -->
  <g>
    <rect x="430" y="80" width="160" height="280" rx="8" fill="#E0E7FF" stroke="#4169E1" stroke-width="2" />
    <path d="M 480 130 L 510 160 L 480 190 L 450 160 Z" fill="#4169E1" opacity="0.7" />
    <path d="M 540 130 L 570 160 L 540 190 L 510 160 Z" fill="#0B1325" opacity="0.7" />
    <text x="510" y="285" text-anchor="middle" class="block-title">Conflict Resolution</text>
    <text x="510" y="305" text-anchor="middle" font-size="11" fill="#475569">Safe merging</text>
  </g>

  <!-- Block 4: Verification -->
  <g>
    <rect x="620" y="80" width="160" height="280" rx="8" fill="#F5F3FF" stroke="#0B1325" stroke-width="2" />
    <g transform="translate(700, 140)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#0B1325" stroke-width="2" />
      <path d="M -8 -5 L 0 5 L 8 -8" fill="none" stroke="#0B1325" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="700" y="285" text-anchor="middle" class="block-title">Independent Verification</text>
    <text x="700" y="305" text-anchor="middle" font-size="11" fill="#475569">Each agent verifies</text>
  </g>

  <!-- Block 5: Auditable State -->
  <g>
    <rect x="810" y="80" width="160" height="280" rx="8" fill="#E0E7FF" stroke="#4169E1" stroke-width="2" />
    <circle cx="860" cy="130" r="6" fill="#4169E1" />
    <line x1="866" y1="130" x2="890" y2="130" stroke="#4169E1" stroke-width="2" />
    <circle cx="860" cy="160" r="6" fill="#4169E1" />
    <line x1="866" y1="160" x2="890" y2="160" stroke="#4169E1" stroke-width="2" />
    <circle cx="860" cy="190" r="6" fill="#4169E1" />
    <line x1="866" y1="190" x2="890" y2="190" stroke="#4169E1" stroke-width="2" />
    <text x="890" y="285" text-anchor="middle" class="block-title">Auditable State</text>
    <text x="890" y="305" text-anchor="middle" font-size="11" fill="#475569">Complete path</text>
  </g>

  <!-- Block 6: Human Oversight -->
  <g>
    <rect x="1000" y="80" width="160" height="280" rx="8" fill="#F5F3FF" stroke="#0B1325" stroke-width="2" />
    <circle cx="1080" cy="130" r="10" fill="#0B1325" />
    <path d="M 1080 140 L 1080 160 M 1070 150 L 1090 150" stroke="#0B1325" stroke-width="2" stroke-linecap="round" />
    <text x="1080" y="285" text-anchor="middle" class="block-title">Human Oversight</text>
    <text x="1080" y="305" text-anchor="middle" font-size="11" fill="#475569">Escalation & review</text>
  </g>
</svg>