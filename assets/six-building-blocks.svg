<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" width="100%" height="auto">
  <defs>
    <style>
      .block-bg { fill: #F8FAFC; stroke-width: 2; }
      .block-light { fill: #E0E7FF; stroke: #4169E1; }
      .block-dark { fill: #F5F3FF; stroke: #0B1325; }
      .block-title { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #0B1325; }
      .block-subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" class="block-bg" fill="#F8FAFC"/>

  <!-- Block 1: Shared Facts -->
  <g>
    <rect x="50" y="80" width="160" height="300" rx="8" class="block-light"/>
    <circle cx="130" cy="120" r="20" fill="#4169E1"/>
    <circle cx="110" cy="155" r="16" fill="#4169E1" opacity="0.6"/>
    <circle cx="150" cy="160" r="16" fill="#4169E1" opacity="0.6"/>
    <text x="130" y="305" text-anchor="middle" class="block-title">Shared Facts</text>
    <text x="130" y="325" text-anchor="middle" class="block-subtitle">Conflict-free store</text>
  </g>

  <!-- Block 2: Durable History -->
  <g>
    <rect x="240" y="80" width="160" height="300" rx="8" class="block-dark"/>
    <rect x="265" y="115" width="110" height="18" rx="2" fill="#0B1325" opacity="0.7"/>
    <rect x="265" y="145" width="100" height="18" rx="2" fill="#0B1325" opacity="0.5"/>
    <rect x="265" y="175" width="110" height="18" rx="2" fill="#0B1325" opacity="0.3"/>
    <text x="320" y="305" text-anchor="middle" class="block-title">Durable History</text>
    <text x="320" y="325" text-anchor="middle" class="block-subtitle">Append-only log</text>
  </g>

  <!-- Block 3: Conflict Resolution -->
  <g>
    <rect x="430" y="80" width="160" height="300" rx="8" class="block-light"/>
    <path d="M 480 130 L 510 165 L 480 200 L 450 165 Z" fill="#4169E1" opacity="0.8"/>
    <path d="M 540 130 L 570 165 L 540 200 L 510 165 Z" fill="#0B1325" opacity="0.8"/>
    <text x="510" y="305" text-anchor="middle" class="block-title">Conflict Resolution</text>
    <text x="510" y="325" text-anchor="middle" class="block-subtitle">Safe merging</text>
  </g>

  <!-- Block 4: Verification -->
  <g>
    <rect x="620" y="80" width="160" height="300" rx="8" class="block-dark"/>
    <circle cx="700" cy="155" r="22" fill="none" stroke="#0B1325" stroke-width="2.5"/>
    <path d="M 692 148 L 700 162 L 708 145" fill="none" stroke="#0B1325" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="700" y="305" text-anchor="middle" class="block-title">Independent Verification</text>
    <text x="700" y="325" text-anchor="middle" class="block-subtitle">Each agent verifies</text>
  </g>

  <!-- Block 5: Auditable State -->
  <g>
    <rect x="810" y="80" width="160" height="300" rx="8" class="block-light"/>
    <circle cx="860" cy="135" r="7" fill="#4169E1"/>
    <line x1="867" y1="135" x2="895" y2="135" stroke="#4169E1" stroke-width="2.5"/>
    <circle cx="860" cy="165" r="7" fill="#4169E1"/>
    <line x1="867" y1="165" x2="895" y2="165" stroke="#4169E1" stroke-width="2.5"/>
    <circle cx="860" cy="195" r="7" fill="#4169E1"/>
    <line x1="867" y1="195" x2="895" y2="195" stroke="#4169E1" stroke-width="2.5"/>
    <text x="890" y="305" text-anchor="middle" class="block-title">Auditable State</text>
    <text x="890" y="325" text-anchor="middle" class="block-subtitle">Complete path</text>
  </g>

  <!-- Block 6: Human Oversight -->
  <g>
    <rect x="1000" y="80" width="160" height="300" rx="8" class="block-dark"/>
    <circle cx="1080" cy="135" r="12" fill="#0B1325"/>
    <line x1="1080" y1="147" x2="1080" y2="175" stroke="#0B1325" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1062" y1="161" x2="1098" y2="161" stroke="#0B1325" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1080" y="305" text-anchor="middle" class="block-title">Human Oversight</text>
    <text x="1080" y="325" text-anchor="middle" class="block-subtitle">Escalation & review</text>
  </g>
</svg>