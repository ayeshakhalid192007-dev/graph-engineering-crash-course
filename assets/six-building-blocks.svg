<svg viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Block 1: Shared Facts -->
  <rect x="20" y="10" width="160" height="120" rx="3" fill="none" stroke="#4169E1" stroke-width="2"/>
  <circle cx="100" cy="40" r="10" fill="#4169E1"/>
  <text x="100" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B1325">Shared Facts</text>
  <text x="100" y="110" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Source of truth</text>

  <!-- Block 2: Durable History -->
  <rect x="200" y="10" width="160" height="120" rx="3" fill="none" stroke="#0B1325" stroke-width="2"/>
  <line x1="220" y1="35" x2="350" y2="35" stroke="#0B1325" stroke-width="1.5" opacity="0.7"/>
  <line x1="220" y1="48" x2="345" y2="48" stroke="#0B1325" stroke-width="1.5" opacity="0.5"/>
  <line x1="220" y1="61" x2="350" y2="61" stroke="#0B1325" stroke-width="1.5" opacity="0.3"/>
  <text x="280" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B1325">Durable History</text>
  <text x="280" y="110" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Append-only log</text>

  <!-- Block 3: Conflict Resolution -->
  <rect x="380" y="10" width="160" height="120" rx="3" fill="none" stroke="#4169E1" stroke-width="2"/>
  <circle cx="440" cy="40" r="6" fill="#4169E1"/>
  <circle cx="465" cy="40" r="6" fill="#0B1325"/>
  <line x1="440" y1="40" x2="465" y2="40" stroke="#4169E1" stroke-width="1.5" opacity="0.5"/>
  <text x="460" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B1325">Conflict Resolution</text>
  <text x="460" y="110" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Safe merging</text>

  <!-- Block 4: Verification -->
  <rect x="560" y="10" width="160" height="120" rx="3" fill="none" stroke="#0B1325" stroke-width="2"/>
  <circle cx="640" cy="40" r="9" fill="none" stroke="#0B1325" stroke-width="1.5"/>
  <path d="M 636 36 L 640 42 L 645 34" fill="none" stroke="#0B1325" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B1325">Independent</text>
  <text x="640" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B1325">Verification</text>

  <!-- Block 5: Auditable State -->
  <rect x="740" y="10" width="160" height="120" rx="3" fill="none" stroke="#4169E1" stroke-width="2"/>
  <circle cx="780" cy="38" r="3" fill="#4169E1"/>
  <line x1="783" y1="38" x2="800" y2="38" stroke="#4169E1" stroke-width="1"/>
  <circle cx="780" cy="50" r="3" fill="#4169E1"/>
  <line x1="783" y1="50" x2="800" y2="50" stroke="#4169E1" stroke-width="1"/>
  <circle cx="780" cy="62" r="3" fill="#4169E1"/>
  <line x1="783" y1="62" x2="800" y2="62" stroke="#4169E1" stroke-width="1"/>
  <text x="820" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B1325">Auditable State</text>
  <text x="820" y="110" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Complete path</text>

  <!-- Block 6: Human Oversight -->
  <rect x="920" y="10" width="160" height="120" rx="3" fill="none" stroke="#0B1325" stroke-width="2"/>
  <circle cx="985" cy="38" r="7" fill="#0B1325"/>
  <line x1="985" y1="45" x2="985" y2="58" stroke="#0B1325" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="973" y1="51.5" x2="997" y2="51.5" stroke="#0B1325" stroke-width="1.5" stroke-linecap="round"/>
  <text x="1000" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B1325">Human</text>
  <text x="1000" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B1325">Oversight</text>
</svg>